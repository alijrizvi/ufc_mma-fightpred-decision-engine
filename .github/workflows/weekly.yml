name: Weekly Cards Refresh

on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC; UFCStats mirror updates after weekend events
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch, train, gate, publish (fails loudly on bad data)
        run: python -m src.engine.pipeline --raw-dir data/raw --out-dir artifacts/cards --fetch
      - name: Verify published cards before committing
        run: PYTHONPATH=. python -m pytest tests/test_semantic.py tests/test_profiles.py -q
      - name: Commit refreshed cards
        run: |
          git config user.name "cagequant-bot"
          git config user.email "cagequant-bot@users.noreply.github.com"
          git add artifacts/cards
          git diff --cached --quiet && echo "No change (gate held or same data)" && exit 0
          git commit -m "chore: weekly cards refresh $(date -u +%F)"
          git push
