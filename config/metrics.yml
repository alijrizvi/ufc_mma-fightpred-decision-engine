# Governed semantic layer (ADR 024). Registry over artifacts/cards/cards.json ONLY.
# Every metric must name a real card field, a description, and a believable range.
version: 2
metrics:
  ATT:
    field: ATT
    description: "Attack rating (striking offense), 0-100 scale."
    min: 0
    max: 100
  DEF:
    field: DEF
    description: "Defense rating (damage avoidance), 0-100 scale."
    min: 0
    max: 100
  WRE:
    field: WRE
    description: "Wrestling rating (takedowns and control), 0-100 scale."
    min: 0
    max: 100
  SUB:
    field: SUB
    description: "Submission rating (offense and defense), 0-100 scale."
    min: 0
    max: 100
  STA:
    field: STA
    description: "Stamina rating (output held across rounds), 0-100 scale."
    min: 0
    max: 100
  PSY:
    field: PSY
    description: "Psychology rating (composure and fight IQ), 0-100 scale."
    min: 0
    max: 100
  ufc_bouts:
    field: ufc_bouts
    description: "Number of UFC bouts on record."
    min: 0
